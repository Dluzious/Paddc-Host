    /* setup */
    suFormat: function (el) { UI.setup.format = el.dataset.v; render(); },
    suTeam: function (el) { UI.setup.teamMode = el.dataset.v; render(); },
    suScType: function (el) { var d = UI.setup; d.scType = el.dataset.v; d.n = d.scType === 'tennis' ? 4 : 21; d.scMode = d.scType === 'tennis' ? 'race' : 'total'; render(); },
    suScMode: function (el) { UI.setup.scMode = el.dataset.v; render(); },
    suN: function (el) { var d = UI.setup; d.n = Math.max(1, Math.min(99, d.n + +el.dataset.v)); render(); },
    suNset: function (el) { UI.setup.n = +el.dataset.v; render(); },
    suCourts: function (el) {
      var d = UI.setup, v = +el.dataset.v;
      if (v > 0 && d.courts.length < 6) d.courts.push({ name: 'Court ' + (d.courts.length + 1), gender: 'mix', color: 'blue', hostId: '' });
      if (v < 0 && d.courts.length > 1) d.courts.pop();
      render();
    },
    suCg: function (el) { var x = el.dataset.v.split('|'); UI.setup.courts[+x[1]].gender = x[0]; render(); },
    suColor: function (el) { var x = el.dataset.v.split('|'); UI.setup.courts[+x[1]].color = x[0]; render(); },
    suDeuce: function (el) { UI.setup.deuce = el.dataset.v; render(); },
    suHostT: function (el) {
      var d = UI.setup, id = el.dataset.p, i = d.hosts.indexOf(id);
      if (i >= 0) { d.hosts.splice(i, 1); d.courts.forEach(function (c) { if (c.hostId === id) c.hostId = ''; }); }
      else {
        d.hosts.push(id);
        var free = d.courts.filter(function (c) { return !c.hostId; })[0]; if (free) free.hostId = id; // otomatis jadi wasit court kosong
      }
      render();
    },
    suStreak: function (el) { UI.setup.maxStreak = +el.dataset.v; render(); },
    suDraw: function (el) { UI.setup.drawMode = el.dataset.v; render(); },
    fillNow: function () {
      confirmBox('Undi sekarang?', 'Court kosong diisi dari pemain yang sedang menunggu, tanpa menunggu court lain selesai.', [{ label: 'Batal', value: null }, { label: 'Undi sekarang', value: 1, kind: 'primary' }])
        .then(function (v) {
          if (!v) return;
          var stop = shuffleOverlay(freeCourts());
          act('fill', { force: true }, { quiet: true }).then(function () { stop(); if (freeCourts().length) toast('Pemain yang menunggu belum cukup untuk mengisi court.', 'err'); }, stop);
        });
    },
    suSort: function (el) { UI.setup.sortBy = el.dataset.v; render(); },
    suPick: function (el) {
      var d = UI.setup, id = el.dataset.p;
      d.sel[id] = !d.sel[id];
      if (!d.sel[id]) d.teams.forEach(function (t) { if (t.a === id) t.a = ''; if (t.b === id) t.b = ''; });
      if (d.teamMode === 'fixed') { render(); return; }
      el.classList.toggle('on', !!d.sel[id]);
      var sel = Object.keys(d.sel).filter(function (k) { return d.sel[k]; }), ok = setupReady(d, sel);
      var nL = sel.filter(function (k) { return P(k).gender === 'L'; }).length;
      $('.startbar .sum').innerHTML = '<b>' + sel.length + ' pemain · ' + d.courts.length + ' court</b>' + esc(ok.msg);
      $('[data-act="suStart"]').disabled = !ok.ok;
      var chips = $$('.card h3 .chip');
      if (chips.length >= 2) { chips[0].innerHTML = icon('mars') + nL; chips[1].innerHTML = icon('venus') + (sel.length - nL); }
    },
    suAll: function () { var d = UI.setup; playerList().forEach(function (p) { d.sel[p.id] = true; }); render(); },
    suNone: function () { UI.setup.sel = {}; UI.setup.teams = []; render(); },
    suAddNew: function () { openEditor(null, 'user', function (p) { UI.setup.sel[p.id] = true; render(); }); },
    suPair: function () {
      var d = UI.setup, sel = Object.keys(d.sel).filter(function (k) { return d.sel[k]; });
      if (sel.length < 2) { toast('Pilih peserta dulu', 'err'); return; }
      d.teams = autoPair(sel); render();
    },
    suStart: function () {
      var d = UI.setup, when = whenFrom(d);
      var setup = {
        name: d.name.trim() || 'Sesi Paddoc', format: d.format, teamMode: d.teamMode, hosts: d.hosts,
        plan: { when: when, whenText: whenLabel(when), venue: d.venue, theme: d.theme },
        scoring: { type: d.scType, mode: d.scMode, n: d.n }, rules: { maxStreak: d.maxStreak, catchUp: d.catchUp, sortBy: d.sortBy, drawMode: d.drawMode, deuce: d.deuce },
        courts: d.courts, playerIds: Object.keys(d.sel).filter(function (k) { return d.sel[k]; }),
        teams: d.teamMode === 'fixed' ? d.teams.filter(function (t) { return t.a && t.b; }) : []
      };
      withBusy(api('createSession', { setup: setup })).then(function (r) {
        UI.seen = {}; UI.sort = null; UI.group = 'all'; UI.unit = 'player';
        if (r.plan) upsertPlan(r.plan);
        api('listSessions').then(function (s) { DB.sessions = s; }).catch(function () {});
        toast('Rencana dibuat. Bagikan link lobi ke grup.');
        if (r.plan) openLobby(r.sid); else { applyServer(r); go(homeView()); }
      }).catch(function (e) { toast(errMsg(e), 'err'); });
    },
    /* papan & dashboard */
    score: function (el) {
      var m = Engine.findMatch(S, el.dataset.m);
      if (m && Engine.isWaiting(m)) { toast('Match ini belum mulai: masih menunggu pemain dari court lain.', 'err'); return; }
      openScore(el.dataset.m);
    },
    go: function (el) {
      act('go', { m: el.dataset.m }, { quiet: true }).then(function () { toast('Game start! Match in progress…'); }).catch(function () {});
    },
    ended: function (el) { openScore(el.dataset.m); },
    scoreboard: function (el) { UI.sbCourt = el.dataset.c; go('scoreboard'); wake(); },
    sbBack: function () { go(homeView()); },
    sbTap: function (el) { doTally(el.dataset.m, el.dataset.side, false); },
    sbUndo: function (el) { doTally(el.dataset.m, null, true); },
    unwait: function (el) {
      act('unwait', { m: el.dataset.m }).then(function (r) {
        var m = Engine.findMatch(S, el.dataset.m);
        if (m && !Engine.isWaiting(m)) toast('Pemain yang ditunggu sudah diganti. Match bisa mulai.');
      }).catch(function () {});
    },
    call: function (el) {
      var m = Engine.findMatch(S, el.dataset.m);
      act('call', { m: el.dataset.m }, { quiet: true }).then(function () {
        toast('Pemain dipanggil. Notifikasi muncul di HP mereka.');
        if (m) announce(m);
      }).catch(function () {});
    },
    reshuffle: function (el) {
      var m = Engine.findMatch(S, el.dataset.m);
      var stop = shuffleOverlay([m.court]);
      act('reshuffle', { m: el.dataset.m }, { quiet: true }).then(stop, stop);
    },
    voidMatch: function (el) {
      confirmBox('Batalkan match?', 'Match ini tidak dihitung. Pemainnya kembali ke antrean dan court diundi ulang.', [{ label: 'Tidak', value: null }, { label: 'Batalkan match', value: 1, kind: 'danger' }])
        .then(function (v) { if (v) act('void', { m: el.dataset.m }).catch(function () {}); });
    },
    fill: function () {
      var stop = shuffleOverlay(freeCourts());
      act('fill', {}, { quiet: true }).then(function () {
        stop();
        if (freeCourts().length) toast('Pemain yang tersedia belum cukup untuk mengisi court.', 'err');
      }, stop);
    },
    swap: function (el) { openSwap(el.dataset.m, el.dataset.p, el.dataset.side); },
    benchP: function (el) { openBenchP(el.dataset.p); },
    people: function () { openPeople(); },
    settings: function () { openSettings(); },
    history: function () { openHistory(); },
    drawer: function () { document.body.classList.toggle('drawer'); },
    standTab: function (el) { var v = el.dataset.v; if (v === 'team') UI.unit = 'team'; else { UI.unit = 'player'; UI.group = v; } render(); },
    standSort: function (el) { UI.sort = el.dataset.v; render(); },
    end: function () {
      var live = Engine.liveMatches(S).length;
      confirmBox('Akhiri sesi?', live ? live + ' match yang masih berjalan akan dibatalkan (tidak dihitung). Isi skornya dulu kalau ingin tetap dihitung.' : 'Klasemen akhir akan ditampilkan.', [{ label: 'Batal', value: null }, { label: 'Akhiri sesi', value: 1, kind: 'primary' }])
        .then(function (v) { if (v) act('end').then(openPodium).catch(function () {}); });
    },
    podium: function () { openPodium(); },
    ptab: function (el) { UI.ptab = el.dataset.v; render(); },
    newPlayer: function () { openEditor(null, UI.ptab === 'host' ? 'host' : 'user'); },
    editPlayer: function (el) { openEditor(el.dataset.p); },
    aiBatch: function () {
      Object.keys(DB.full).map(function (k) { return DB.full[k]; }).filter(function (p) { return !p.archived && p.asliUrl && !p.proUrl && p.aiStatus !== 'processing'; }).forEach(function (p) { runAI(p.id); });
      toast('Foto diproses satu per satu');
    },
    /* pemain */
    selfSkip: function () { selfAct('skip'); },
    selfReady: function () { selfAct('ready'); },
    selfLeave: function () {
      confirmBox('Keluar dari game?', 'Kamu tidak akan diundi lagi di sesi ini. Kalau sedang main, posisimu diganti pemain lain.', [{ label: 'Batal', value: null }, { label: 'Keluar dari game', value: 1, kind: 'danger' }])
        .then(function (v) { if (v) selfAct('leave'); });
    },
    prefPhoto: function (el) { withBusy(api('updateMe', { photoPref: el.dataset.v })).then(function (p) { onMeUpdated(p); toast('Foto tampil diganti'); }).catch(function (e) { toast(errMsg(e), 'err'); }); },
    testSound: function () { unlockAudio(); chime(); setTimeout(render, 300); if ('Notification' in window && Notification.permission === 'default') { try { Notification.requestPermission(); } catch (e) {} } },
    toggleWake: function () {
      if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; render(); return; }
      if (!navigator.wakeLock) { toast('Perangkat ini tidak mendukung fitur jaga layar', 'err'); return; }
      navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; l.addEventListener('release', function () { wakeLock = null; }); render(); }).catch(function () { toast('Fitur jaga layar ditolak perangkat', 'err'); });
    },
    close: function (el) { closeModal(el.closest('.modal-wrap')); },
    openLobby: function (el) { openLobby(el.dataset.id); },
    chibiBatch: function () {
      var todo = Object.keys(DB.full).map(function (k) { return DB.full[k]; }).filter(needChibi);
      if (!todo.length) return;
      confirmBox('Buat avatar lobi?', todo.length + ' orang belum punya avatar chibi. Dibuat satu per satu lewat OpenAI (±1 menit per orang, biaya OpenAI per gambar). Biarkan halaman ini terbuka sampai selesai.',
        [{ label: 'Batal', value: null }, { label: 'Buat ' + todo.length + ' avatar', value: 1, kind: 'primary' }])
        .then(function (v) {
          if (!v) return;
          toast('Membuat ' + todo.length + ' avatar…');
          todo.forEach(function (x) { runChibi(x.id, true); });
          chibiQueue.then(function () { toast('Pembuatan avatar selesai'); });
        });
    },
    planJoin: function (el) { lobbyJoin(el.dataset.id); },
    planLeave: function (el) { planAct(el.dataset.id, 'rsvp', { on: false }).then(function () { toast('Kehadiran dibatalkan'); }).catch(function () {}); },
    toLobby: function () {
      if (!S) return;
      var sid = S.id;
      confirmBox('Kembali ke lobi?', 'Undian court dibatalkan dan semua kembali ke ruang tunggu. Daftar hadir dan chat tetap ada.', [{ label: 'Batal', value: null }, { label: 'Kembali ke Lobi', value: 1, kind: 'primary' }])
        .then(function (v) { if (v) act('backToLobby', {}).then(function () { openLobby(sid); }).catch(function () {}); });
    },
    copyLink: function () {
      try { navigator.clipboard.writeText(location.href).then(function () { toast('Link disalin. Tempel di Chrome atau Safari.'); }, function () { toast(location.href); }); }
      catch (e) { toast(location.href); }
    },
    doInstall: function () {
      if (!installEvt) return;
      installEvt.prompt();
      installEvt.userChoice.then(function (c) { installEvt = null; if (c.outcome === 'accepted') lsSet('paddoc_installed', true); render(); }).catch(function () {});
    },
    skipInstall: function () { lsSet('paddoc_install_skip', true); startApp(); },
    allowNotif: function () {
      enableNotif(false).then(function () {
        if (Notification.permission === 'default') lsSet('paddoc_notif_skip', true); // prompt ditutup: jangan tanya terus
        startApp();
      });
    },
    skipNotif: function () { lsSet('paddoc_notif_skip', true); startApp(); },
    notifBtn: function () {
      if (pushSupported() && Notification.permission === 'granted') enableNotif(true).then(render);
      else enableNotif(true).then(render);
    }
  };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var a = el.dataset.act;
    if (ACT[a]) ACT[a](el, e);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if ($('#modals .modal-wrap')) closeModal(); else document.body.classList.remove('drawer'); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.sess[data-act]')) { e.preventDefault(); ACT.openSession(e.target); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target, d = UI.setup;
    if (t.id === 'su-name') d.name = t.value;
    else if (t.classList.contains('su-cname')) d.courts[+t.dataset.i].name = t.value;
    else if (t.id === 'su-n') { var v = parseInt(t.value, 10); if (v > 0) d.n = Math.min(99, v); }
    else if (t.id === 'su-q') { d.q = t.value; var pos = t.selectionStart; render(); var ni = $('#su-q'); ni.focus(); ni.setSelectionRange(pos, pos); }
    else if (t.id === 'pq') { UI.pq = t.value; var p2 = t.selectionStart; render(); var n2 = $('#pq'); n2.focus(); n2.setSelectionRange(p2, p2); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target, d = UI.setup;
    if (t.id === 'su-catch') d.catchUp = t.checked;
    else if (t.classList.contains('su-ref')) d.courts[+t.dataset.i].hostId = t.value;
    else if (t.classList.contains('su-team')) {
      var i = +t.dataset.i, slot = t.dataset.slot, v = t.value, old = d.teams[i][slot];
      d.teams.forEach(function (tm, j) { ['a', 'b'].forEach(function (s) { if (tm[s] === v && !(j === i && s === slot)) tm[s] = old; }); });
      d.teams[i][slot] = v; render();
    }
  });

  /* ---------- data demo ---------- */
  function seedDemo() {
    var store = {};
    Core.init(MemoryAdapter(store));
    var T = Core.call('createAdmin', { name: 'Admin Paddoc', gender: 'L', username: 'admin', pin: '123456' }).token;
    var host = Core.call('savePerson', { token: T, person: { name: 'Rudi', gender: 'L', role: 'host' } });
    var names = [['Andi', 'L'], ['Bima', 'L'], ['Raka', 'L'], ['Dimas', 'L'], ['Fajar', 'L'], ['Yoga', 'L'], ['Hendra', 'L'], ['Rizky', 'L'],
      ['Sari', 'P'], ['Nadia', 'P'], ['Ayu', 'P'], ['Laras', 'P'], ['Dewi', 'P'], ['Intan', 'P']];
    var ids = names.map(function (n) { return Core.call('savePerson', { token: T, person: { name: n[0], gender: n[1] } }).id; });
    var r = Core.call('createSession', {
      token: T, setup: {
        name: 'Contoh: Kamis malam di Paddoc', format: 'americano', teamMode: 'random', hostId: host.id,
        scoring: { type: 'points', mode: 'total', n: 21 }, rules: { maxStreak: 2, catchUp: true, sortBy: 'points', drawMode: 'wait' },
        courts: [{ name: 'Court 1', gender: 'mix' }, { name: 'Court 2', gender: 'mix' }, { name: 'Court 3', gender: 'L' }], playerIds: ids
      }
    });
    var sid = r.sid;
    for (var i = 0; i < 9; i++) {
      var S0 = Core.call('poll', {}).S;
      var m = Engine.liveMatches(S0).sort(function (a, b) { return a.no - b.no; })[0];
      var a = 6 + Math.floor(Math.random() * 10);
      Core.call('act', { token: T, sid: sid, type: 'score', payload: { m: m.id, a: a, b: 21 - a } });
    }
    var s = store.sessions[sid], t0 = Date.now() - 80 * 60000;
    s.matches.forEach(function (m, k) {
      if (m.status === 'done') { m.start = t0 + k * 8 * 60000; m.end = m.start + 13 * 60000; }
      else m.start = Date.now() - (3 + k % 3 * 5) * 60000;
    });
    s.lastDone = {}; s.v = (s.v || 0) + 1;
    return store;
  }

  /* ---------- mulai ---------- */
  var LOBBY_LINK = (function () {
    var q = new URLSearchParams(location.search), sid = q.get('lobby');
    if (!sid || sid === 'demo') return null;
    if (q.get('do') && history.replaceState) history.replaceState(null, '', location.pathname + '?lobby=' + encodeURIComponent(sid));
    return { sid: sid, join: q.get('do') === 'join' };
  })();
  function handleLobbyLink(link) {
    if (!link) return;
    if (planById(link.sid)) { openLobby(link.sid); if (link.join) lobbyJoin(link.sid); return; }
    if (LIVE.sid === link.sid) { toast('Sesi itu sudah dimulai'); go(homeView()); return; }
    toast('Lobi tidak ditemukan atau sudah dihapus', 'err');
  }
  var CALL_LINK = (function () {
    var q = new URLSearchParams(location.search), m = q.get('call');
    if (m && history.replaceState) history.replaceState(null, '', location.pathname);
    return m ? { m: m, act: q.get('do') || 'open' } : null;
  })();
  function boot() {
    var t = lsGet('paddoc_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    // pratinjau ruang tunggu dengan 30 pemain dummy (Tahap 1): /?lobby=demo
    if (new URLSearchParams(location.search).get('lobby') === 'demo' && window.Lobby) { Lobby.demo($('#app')); return; }
    registerSW();
    startApp();
  }
  function startApp() {
    var step = onboardStep();
    if (step) {
      UI.view = step; render();
      if (step === 'notify') getPushKey().catch(function () {});
      if (step === 'install' && LOBBY_LINK) {                // tampilkan ringkasan lobi yang dibagikan
        UI.installLobby = LOBBY_LINK.sid;
        api('poll', { token: '' }).then(function (r) { applyPoll(r); render(); }).catch(function () {});
      }
      return;
    }
    $('#app').innerHTML = loaderHTML();
    api('status', { token: '' }).then(function (st) {
      DB.status = st; DB.ai = st.ai;
      if (!st.hasAdmin) { AUTH = { token: '', me: null }; saveAuth(); UI.view = 'firstrun'; render(); return; }
      return refreshMe().then(function () { return pollNow(); }).then(function () {
        if (isStaff()) return loadStaffData();
      }).then(function () {
        UI.view = isStaff() && !S ? 'home' : homeView();
        var L = LOBBY_LINK; LOBBY_LINK = null;
        if (L && planById(L.sid)) { UI.lobbySid = L.sid; UI.view = 'lobby'; }
        render(); schedulePoll(); connectLive();
        syncPush();
        if (L) { if (UI.view === 'lobby') { if (L.join) lobbyJoin(L.sid); } else handleLobbyLink(L); }
        if (CALL_LINK) { handleCallLink(CALL_LINK.m, CALL_LINK.act); CALL_LINK = null; }
      });
    }).catch(function (e) {
      $('#app').innerHTML = '<div class="empty big" style="margin:40px 16px">' + icon('alert') + '<div><b>Gagal memuat data.</b><br>' + esc(errMsg(e)) + '</div><button class="btn" id="retry">Coba lagi</button></div>';
      $('#retry').addEventListener('click', function () { location.reload(); });
    });
  }
  boot();
})();

</script>
