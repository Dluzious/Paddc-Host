  var aiQueue = Promise.resolve();
  function runAI(pid) {
    if (!IS_GAS || !DB.ai.enabled) return;
    DB.players[pid].aiStatus = 'processing';
    render();
    aiQueue = aiQueue.then(function () {
      return gas('generateProPhoto', pid).then(function (np) {
        DB.players[pid] = np;
        toast('Foto pro ' + np.name + ' selesai');
        render();
      }).catch(function (e) {
        DB.players[pid].aiStatus = 'error';
        toast('Foto AI ' + P(pid).name + ' gagal: ' + errMsg(e), 'err');
        render();
      });
    });
  }

  /* ---------- aksi ---------- */
  var ACT = {
    home: function () { if (S) doSave(); go('home'); },
    theme: function () {
      var t = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      lsSet('paddoc_theme', t);
      render();
    },
    newSession: function () { UI.setup = defaultSetup(); go('setup'); },
    playersView: function () { go('players'); },
    openSession: function (el) { openSession(el.dataset.id); },
    delSession: function (el, e) {
      e.stopPropagation();
      var id = el.dataset.id;
      var s = DB.sessions.filter(function (x) { return x.id === id; })[0];
      confirmBox('Hapus sesi?', 'Sesi <b>' + esc(s.name) + '</b> beserta riwayat match dan klasemennya akan dihapus.', [{ label: 'Batal', value: null }, { label: 'Hapus', value: 1, kind: 'danger' }])
        .then(function (v) {
          if (!v) return;
          DB.sessions = DB.sessions.filter(function (x) { return x.id !== id; });
          if (S && S.id === id) S = null;
          if (IS_GAS) gas('deleteSession', id).catch(function (e) { toast(errMsg(e), 'err'); });
          else { delete DEMO.sessions[id]; saveDemo(); }
          render(); toast('Sesi dihapus');
        });
    },
    /* setup */
    suFormat: function (el) { UI.setup.format = el.dataset.v; render(); },
    suTeam: function (el) { UI.setup.teamMode = el.dataset.v; render(); },
    suScType: function (el) { var d = UI.setup; d.scType = el.dataset.v; d.n = d.scType === 'tennis' ? 4 : 21; d.scMode = d.scType === 'tennis' ? 'race' : 'total'; render(); },
    suScMode: function (el) { UI.setup.scMode = el.dataset.v; render(); },
    suN: function (el) { var d = UI.setup; d.n = Math.max(1, Math.min(99, d.n + +el.dataset.v)); render(); },
    suNset: function (el) { UI.setup.n = +el.dataset.v; render(); },
    suCourts: function (el) {
      var d = UI.setup, v = +el.dataset.v;
      if (v > 0 && d.courts.length < 6) d.courts.push({ name: 'Court ' + (d.courts.length + 1), gender: 'mix' });
      if (v < 0 && d.courts.length > 1) d.courts.pop();
      render();
    },
    suCg: function (el) { var x = el.dataset.v.split('|'); UI.setup.courts[+x[1]].gender = x[0]; render(); },
    suStreak: function (el) { UI.setup.maxStreak = +el.dataset.v; render(); },
    suSort: function (el) { UI.setup.sortBy = el.dataset.v; render(); },
    suPick: function (el) {
      var d = UI.setup, id = el.dataset.p;
      d.sel[id] = !d.sel[id];
      if (!d.sel[id]) d.teams.forEach(function (t) { if (t.a === id) t.a = ''; if (t.b === id) t.b = ''; });
      el.classList.toggle('on', !!d.sel[id]);
      refreshStartbar();
    },
    suAll: function () { var d = UI.setup; playerList().forEach(function (p) { d.sel[p.id] = true; }); render(); },
    suNone: function () { UI.setup.sel = {}; UI.setup.teams = []; render(); },
    suAddNew: function () { openEditor(null, function (p) { UI.setup.sel[p.id] = true; render(); }); },
    suPair: function () {
      var d = UI.setup, sel = Object.keys(d.sel).filter(function (k) { return d.sel[k]; });
      if (sel.length < 2) { toast('Pilih peserta dulu', 'err'); return; }
      d.teams = autoPair(sel); render();
    },
    suStart: function () { startSession(); },
    /* papan */
    score: function (el) { openScore(el.dataset.m); },
    reshuffle: function (el) {
      var m = Engine.findMatch(S, el.dataset.m);
      var pitch = $('.court[data-court="' + m.court + '"] .pitch');
      if (pitch) { var ov = document.createElement('div'); ov.className = 'shuffling'; ov.innerHTML = '<div class="roll">' + icon('shuffle') + '<span>Mengacak</span></div>'; pitch.appendChild(ov); }
      setTimeout(function () {
        var nm = Engine.reshuffle(S, DB.players, el.dataset.m);
        persist(); render();
        if (!nm) toast('Tidak ada susunan lain yang memungkinkan', 'err');
      }, 650);
    },
    voidMatch: function (el) {
      confirmBox('Batalkan match?', 'Match ini tidak dihitung. Pemainnya kembali ke antrean dan court diundi ulang.', [{ label: 'Tidak', value: null }, { label: 'Batalkan match', value: 1, kind: 'danger' }])
        .then(function (v) { if (!v) return; Engine.voidMatch(S, el.dataset.m); persist(); render(); setTimeout(dealCourts, 200); });
    },
    fill: function () { dealCourts(); },
    swap: function (el) { openSwap(el.dataset.m, el.dataset.p, el.dataset.side); },
    benchP: function (el) { openBenchP(el.dataset.p); },
    people: function () { openPeople(); },
    settings: function () { openSettings(); },
    history: function () { openHistory(); },
    drawer: function () { document.body.classList.toggle('drawer'); },
    standTab: function (el) { var v = el.dataset.v; if (v === 'team') { UI.unit = 'team'; } else { UI.unit = 'player'; UI.group = v; } render(); },
    standSort: function (el) { UI.sort = el.dataset.v; render(); },
    end: function () {
      var live = Engine.liveMatches(S).length;
      confirmBox('Akhiri sesi?', live ? live + ' match yang masih berjalan akan dibatalkan (tidak dihitung). Isi skornya dulu kalau ingin tetap dihitung.' : 'Klasemen akhir akan ditampilkan.', [{ label: 'Batal', value: null }, { label: 'Akhiri sesi', value: 1, kind: 'primary' }])
        .then(function (v) {
          if (!v) return;
          Engine.liveMatches(S).forEach(function (m) { Engine.voidMatch(S, m.id); });
          S.status = 'done'; persist(); render(); openPodium();
        });
    },
    podium: function () { openPodium(); },
    newPlayer: function () { openEditor(null); },
    editPlayer: function (el) { openEditor(el.dataset.p); },
    aiBatch: function () {
      playerList().filter(function (p) { return p.photoUrl && !p.proUrl && p.aiStatus !== 'processing'; }).forEach(function (p) { runAI(p.id); });
      toast('Foto diproses satu per satu');
    },
    close: function (el) { closeModal(el.closest('.modal-wrap')); }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var a = el.dataset.act;
    if (ACT[a]) ACT[a](el, e);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if ($('#modals .modal-wrap')) closeModal(); else document.body.classList.remove('drawer'); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.sess[data-act]')) { e.preventDefault(); openSession(e.target.dataset.id); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target, d = UI.setup;
    if (t.id === 'su-name') d.name = t.value;
    else if (t.classList.contains('su-cname')) d.courts[+t.dataset.i].name = t.value;
    else if (t.id === 'su-n') { var v = parseInt(t.value, 10); if (v > 0) d.n = Math.min(99, v); }
    else if (t.id === 'su-q') { d.q = t.value; var pos = t.selectionStart; render(); var ni = $('#su-q'); ni.focus(); ni.setSelectionRange(pos, pos); }
    else if (t.id === 'pq') { UI.pq = t.value; var p2 = t.selectionStart; render(); var n2 = $('#pq'); n2.focus(); n2.setSelectionRange(p2, p2); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target, d = UI.setup;
    if (t.id === 'su-catch') d.catchUp = t.checked;
    else if (t.classList.contains('su-team')) {
      var i = +t.dataset.i, slot = t.dataset.slot, v = t.value, old = d.teams[i][slot];
      d.teams.forEach(function (tm, j) {
        ['a', 'b'].forEach(function (s) { if (tm[s] === v && !(j === i && s === slot)) tm[s] = old; });
      });
      d.teams[i][slot] = v;
      render();
    }
  });
  function refreshStartbar() {
    var d = UI.setup, sel = Object.keys(d.sel).filter(function (k) { return d.sel[k]; });
    if (d.teamMode === 'fixed') { render(); return; }
    var ok = setupReady(d, sel);
    var nL = sel.filter(function (k) { return P(k).gender === 'L'; }).length;
    $('.startbar .sum').innerHTML = '<b>' + sel.length + ' pemain · ' + d.courts.length + ' court</b>' + esc(ok.msg);
    $('[data-act="suStart"]').disabled = !ok.ok;
    var chips = $$('.card h3 .chip');
    if (chips.length >= 2) { chips[0].innerHTML = icon('mars') + nL; chips[1].innerHTML = icon('venus') + (sel.length - nL); }
  }

  function startSession() {
    var d = UI.setup;
    var sel = Object.keys(d.sel).filter(function (k) { return d.sel[k] && DB.players[k]; });
    var teams = d.teamMode === 'fixed' ? d.teams.filter(function (t) { return t.a && t.b; }) : [];
    S = Engine.newSession({
      name: d.name.trim() || 'Sesi Paddoc', format: d.format, teamMode: d.teamMode,
      scoring: { type: d.scType, mode: d.scMode, n: d.n },
      rules: { maxStreak: d.maxStreak, catchUp: d.catchUp, sortBy: d.sortBy },
      courts: d.courts, playerIds: sel, teams: teams
    });
    UI.seen = {}; UI.sort = null; UI.group = 'all'; UI.unit = 'player'; UI.justDone = {};
    persist();
    go('board');
    setTimeout(dealCourts, 300);
  }

  function openSession(id) {
    var load = IS_GAS ? gas('getSession', id) : Promise.resolve(JSON.parse(JSON.stringify(DEMO.sessions[id] || null)));
    if (IS_GAS) toast('Membuka sesi…');
    load.then(function (s) {
      if (!s) { toast('Sesi tidak ditemukan', 'err'); return; }
      S = s; UI.seen = {}; UI.sort = null; UI.group = 'all'; UI.unit = 'player'; UI.justDone = {};
      go('board');
      if (S.status === 'live' && freeCourts().length) setTimeout(dealCourts, 400);
    }).catch(function (e) { toast('Gagal membuka sesi: ' + errMsg(e), 'err'); });
  }

  /* ---------- data contoh (mode demo) ---------- */
  function seedDemo() {
    var names = [['Andi', 'L'], ['Bima', 'L'], ['Raka', 'L'], ['Dimas', 'L'], ['Fajar', 'L'], ['Yoga', 'L'], ['Hendra', 'L'], ['Rizky', 'L'],
      ['Sari', 'P'], ['Nadia', 'P'], ['Ayu', 'P'], ['Laras', 'P'], ['Dewi', 'P'], ['Intan', 'P']];
    var players = names.map(function (n, i) { return { id: 'demo_p' + i, name: n[0], gender: n[1] }; });
    var pm = {}; players.forEach(function (p) { pm[p.id] = p; });
    var s = Engine.newSession({
      name: 'Contoh: Kamis malam di Paddoc', format: 'americano', teamMode: 'random',
      scoring: { type: 'points', mode: 'total', n: 21 }, rules: { maxStreak: 2, catchUp: true, sortBy: 'points' },
      courts: [{ name: 'Court 1', gender: 'mix' }, { name: 'Court 2', gender: 'mix' }, { name: 'Court 3', gender: 'L' }],
      playerIds: players.map(function (p) { return p.id; })
    });
    Engine.fillCourts(s, pm);
    var t0 = Date.now() - 75 * 60000;
    for (var i = 0; i < 9; i++) {
      var live = Engine.liveMatches(s).sort(function (a, b) { return a.no - b.no; });
      var m = live[0];
      var a = 6 + Math.floor(Math.random() * 10);
      m.start = t0 + i * 8 * 60000;
      Engine.submitScore(s, m.id, a, 21 - a);
      m.end = m.start + 13 * 60000;
      Engine.fillCourts(s, pm, m.court);
    }
    Engine.liveMatches(s).forEach(function (m, i) { m.start = Date.now() - (4 + i * 5) * 60000; });
    var sessions = {}; sessions[s.id] = s;
    return { players: players, sessions: sessions };
  }

  /* ---------- PIN host & muat data ---------- */
  function loadLive() {
    gas('getInitialData').then(function (d) {
      DB.players = {}; (d.players || []).forEach(function (p) { DB.players[p.id] = p; });
      DB.sessions = d.sessions || [];
      DB.ai = d.ai || { enabled: false };
      render();
    }).catch(function (e) {
      if (/PIN_/.test(errMsg(e))) { showPin(e); return; }
      $('#app').innerHTML = '<div class="empty" style="margin:40px 16px">' + icon('alert') + '<div><b>Gagal memuat data.</b><br>' + esc(errMsg(e)) + '</div><button class="btn" id="retry">Coba lagi</button></div>';
      $('#retry').addEventListener('click', function () { location.reload(); });
    });
  }
  function showPin(e) {
    var code = (errMsg(e).match(/PIN_[A-Z_]+/) || [''])[0];
    var had = !!lsGet('paddoc_pin');
    var msg = code === 'PIN_LOCKED' ? 'Terlalu banyak percobaan salah. Tunggu 10 menit lalu coba lagi.'
      : code === 'PIN_NOT_SET' ? 'PIN belum dibuat. Isi APP_PIN di Script Properties Apps Script.'
      : had ? 'PIN salah. Coba lagi.' : 'Masukkan PIN host untuk membuka data.';
    $('#app').innerHTML = '<form class="pin-gate" id="pinf"><img src="' + LOGO + '" alt="Logo Padel Doc">' +
      '<h1 class="wordmark">Paddoc <b>Host</b></h1><p class="muted">' + esc(msg) + '</p>' +
      '<input id="pin-in" class="input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN host">' +
      '<button class="btn primary lg block" type="submit">' + icon('login') + 'Masuk</button></form>';
    if (had && code !== 'PIN_LOCKED') lsSet('paddoc_pin', '');
    $('#pinf').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var v = $('#pin-in').value.trim();
      if (!v) return;
      lsSet('paddoc_pin', v);
      $('#app').innerHTML = '<div class="empty" style="margin:40px 16px">' + icon('loader', 'spin') + '<div>Membuka…</div></div>';
      loadLive();
    });
    setTimeout(function () { var i = $('#pin-in'); if (i) i.focus(); }, 50);
  }

  /* ---------- mulai ---------- */
  function boot() {
    var t = lsGet('paddoc_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    if (IS_GAS) {
      $('#app').innerHTML = '<div class="empty" style="margin:40px 16px">' + icon('loader', 'spin') + '<div>Memuat data dari Google Sheet…</div></div>';
      loadLive();
    } else {
      DEMO = lsGet(LS_KEY) || seedDemo();
      saveDemo();
      DEMO.players.forEach(function (p) { DB.players[p.id] = p; });
      DB.sessions = Object.keys(DEMO.sessions).map(function (k) { return sessionSummary(DEMO.sessions[k]); })
        .sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); });
      render();
    }
  }
  window.addEventListener('beforeunload', function () { if (saveT) { clearTimeout(saveT); doSave(); } });
  boot();
})();

</script>

</body>
</html>
